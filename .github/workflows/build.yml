# ESP32-S3 Deauth — GitHub Actions build
# Patches libnet80211.a, installs NimBLE, compiles for esp32s3

name: ESP32-S3 Deauth Build

on:
  push:
    paths:
      - 'deauth.ino'
      - 'build.yml'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Cache ESP32 core
        uses: actions/cache@v4
        with:
          path: ~/.arduino15/packages/esp32
          key: esp32-3.3.11-${{ hashFiles('build.yml') }}

      - name: Install ESP32 core 3.3.11
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11
          arduino-cli core list | grep -q "esp32:esp32.*3.3.11" || {
            echo "FATAL: core 3.3.11 not installed"; exit 1;
          }

      - name: Install NimBLE-Arduino
        run: |
          set -euo pipefail
          arduino-cli lib install "NimBLE-Arduino"
          arduino-cli lib list | grep -qi NimBLE || {
            echo "FATAL: NimBLE-Arduino not installed"; exit 1;
          }

      - name: Locate tools + libnet80211.a
        run: |
          set -euo pipefail
          TOOLS="$HOME/.arduino15/packages/esp32/tools"
          PKG="$HOME/.arduino15/packages/esp32"

          OBJCOPY=$(find "$TOOLS" -name "xtensa-esp32s3-elf-objcopy" -type f | sort -V | tail -1)
          NM=$(find "$TOOLS" -name "xtensa-esp32s3-elf-nm"      -type f | sort -V | tail -1)
          READELF=$(find "$TOOLS" -name "xtensa-esp32s3-elf-readelf" -type f | sort -V | tail -1)
          AR=$(find "$TOOLS" -name "xtensa-esp32s3-elf-ar"      -type f | sort -V | tail -1)
          OBJDUMP=$(find "$TOOLS" -name "xtensa-esp32s3-elf-objdump" -type f | sort -V | tail -1)

          LIBNET=$(find "$PKG" -name "libnet80211.a" -type f 2>/dev/null | \
            grep -i esp32s3 | sort -V | tail -1 || true)
          if [ -z "$LIBNET" ]; then
            LIBNET=$(find "$PKG" -name "libnet80211.a" -type f 2>/dev/null | \
              sort -V | tail -1 || true)
          fi

          [ -x "$OBJCOPY" ] || { echo "FATAL: objcopy missing"; exit 1; }
          [ -x "$NM"      ] || { echo "FATAL: nm missing"; exit 1; }
          [ -x "$READELF" ] || { echo "FATAL: readelf missing"; exit 1; }
          [ -x "$AR"      ] || { echo "FATAL: ar missing"; exit 1; }
          [ -x "$OBJDUMP" ] || { echo "FATAL: objdump missing"; exit 1; }
          [ -f "$LIBNET"  ] || {
            echo "FATAL: libnet80211.a not found"
            find "$PKG" -name "libnet80211.a" 2>/dev/null || true
            exit 1
          }

          {
            echo "OBJCOPY=$OBJCOPY"
            echo "NM=$NM"
            echo "READELF=$READELF"
            echo "AR=$AR"
            echo "OBJDUMP=$OBJDUMP"
            echo "LIBNET=$LIBNET"
          } >> "$GITHUB_ENV"

          echo "OBJCOPY : $OBJCOPY"
          echo "NM      : $NM"
          echo "READELF : $READELF"
          echo "AR      : $AR"
          echo "OBJDUMP : $OBJDUMP"
          echo "LIBNET  : $LIBNET"

      - name: Weaken ieee80211_raw_frame_sanity_check
        run: |
          set -euo pipefail

          echo "=== BEFORE (archive) ==="
          "$NM" "$LIBNET" 2>/dev/null | grep "ieee80211_raw_frame_sanity_check" || true

          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          cd "$TMP"

          "$AR" x "$LIBNET"

          TARGET_O=""
          for o in *.o; do
            if "$NM" "$o" 2>/dev/null | grep -q "ieee80211_raw_frame_sanity_check"; then
              echo "Found symbol in: $o"
              TARGET_O="$o"
              "$NM" "$o" | grep "ieee80211_raw_frame_sanity_check"
            fi
          done

          if [ -z "$TARGET_O" ]; then
            echo "WARN: symbol not present in any member — nothing to weaken"
          else
            "$OBJCOPY" --weaken-symbol=ieee80211_raw_frame_sanity_check "$TARGET_O" "${TARGET_O}.weak"
            mv "${TARGET_O}.weak" "$TARGET_O"

            echo "=== AFTER (member $TARGET_O) ==="
            "$NM" "$TARGET_O" | grep "ieee80211_raw_frame_sanity_check" || true

            if "$NM" "$TARGET_O" | grep -qE " [Tt] ieee80211_raw_frame_sanity_check"; then
              echo "FATAL: symbol still strong TEXT after objcopy --weaken"
              exit 1
            fi
            if ! "$NM" "$TARGET_O" | grep -qE " [Ww] ieee80211_raw_frame_sanity_check"; then
              echo "FATAL: symbol not weak after objcopy"
              exit 1
            fi
            echo "Member weaken OK"
          fi

          rm -f "$LIBNET"
          "$AR" rcs "$LIBNET" *.o

          echo "=== AFTER (archive) ==="
          AFTER=$("$NM" "$LIBNET" 2>/dev/null | grep "ieee80211_raw_frame_sanity_check" || true)
          echo "$AFTER"

          if echo "$AFTER" | grep -qE " [Tt] "; then
            echo "FATAL: archive still has strong TEXT symbol"
            exit 1
          fi
          if [ -n "$AFTER" ] && ! echo "$AFTER" | grep -qE " [Ww] "; then
            echo "FATAL: archive symbol not weak"
            exit 1
          fi

          "$AR" t "$LIBNET" >/dev/null || { echo "FATAL: archive corrupted"; exit 1; }
          echo "Archive integrity OK — symbol is weak (or absent)"

      - name: Compile firmware
        run: |
          set -euo pipefail
          mkdir -p deauth
          cp deauth.ino deauth/

          FQBN="esp32:esp32:esp32s3:\
          PartitionScheme=huge_app,\
          CDCOnBoot=cdc,\
          USBMode=hwcdc,\
          PSRAM=opi,\
          FlashMode=qio,\
          FlashSize=16M,\
          CPUFreq=240,\
          DebugLevel=none,\
          UploadSpeed=921600"

          FQBN=$(echo "$FQBN" | tr -d ' \n')
          echo "FQBN: $FQBN"

          arduino-cli compile --fqbn "$FQBN" --output-dir build deauth
          ls -lh build/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deauth-firmware
          path: |
            build/*.bin
            build/*.elf
            deauth.ino
